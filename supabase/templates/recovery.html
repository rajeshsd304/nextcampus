<h2>Reset your NextCampus password</h2>
<p>We received a request to reset your password.</p>
<p>
  <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=recovery&next=/reset-password"
    >Choose a new password</a
  >
</p>
